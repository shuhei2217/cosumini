name: Deploy to server (FTP)

# main に push されるたび、XREA サーバーへ lftp で自動アップロードします。
# basic-ftp ベースのアクションは XREA のパッシブ(EPSV)応答で ECONNRESET になるため、
# PASV を強制できる lftp を使います。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # （任意）GitHub の Secrets に STATS_PASS を登録しておくと、
      # アクセス解析ページ（stats.php）のパスワードとして自動で反映されます。
      # 登録していない場合は、初回アクセス時にブラウザ画面上で設定できます。
      - name: Apply stats password from secret (optional)
        env:
          STATS_PASS: ${{ secrets.STATS_PASS }}
        run: |
          if [ -n "$STATS_PASS" ]; then
            mkdir -p data
            B64=$(printf '%s' "$STATS_PASS" | base64 | tr -d '\n')
            printf "<?php\nreturn array('pass_b64' => '%s');\n" "$B64" > data/stats-auth.php
            echo "STATS_PASS を stats.php のパスワードとして反映します。"
          else
            echo "STATS_PASS は未登録です（ブラウザ上での初回設定を使用します）。"
          fi

      # HTML がキャッシュされると、更新した内容（計測タグを含む）が訪問者に届きません。
      # サーバー上の .htaccess に「HTMLはキャッシュしない」設定を追記します。
      # 既存の .htaccess は必ず取得してから末尾に追記し、内容を失わないようにします。
      - name: Ensure HTML is not cached (merge into remote .htaccess)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -u
          OPTS="set ftp:ssl-allow no; set ftp:passive-mode on; set ftp:prefer-epsv no; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 20;"
          if ! lftp -c "$OPTS open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; cd '$FTP_SERVER_DIR'; cls -1 -a" > "$RUNNER_TEMP/listing.txt" 2> "$RUNNER_TEMP/lftp_err.txt"; then
            echo "サーバーの一覧を取得できませんでした。.htaccess は変更しません。"
            cat "$RUNNER_TEMP/lftp_err.txt" || true
            exit 0
          fi
          if grep -qx '\.htaccess' "$RUNNER_TEMP/listing.txt"; then
            echo "既存の .htaccess を取得します。"
            if ! lftp -c "$OPTS open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; cd '$FTP_SERVER_DIR'; get .htaccess -o $RUNNER_TEMP/remote.htaccess"; then
              echo "取得に失敗しました。上書き事故を防ぐため .htaccess は変更しません。"
              exit 0
            fi
          else
            echo "サーバーに .htaccess はありません。新規作成します。"
            : > "$RUNNER_TEMP/remote.htaccess"
          fi
          cp "$RUNNER_TEMP/remote.htaccess" .htaccess
          if grep -q 'COSMINI-NOCACHE' "$RUNNER_TEMP/remote.htaccess"; then
            echo "設定済みのため追記しません。"
            exit 0
          fi
          {
            printf '\n'
            printf '# === COSMINI-NOCACHE ここから（自動追記：削除しないでください）===\n'
            printf '# HTMLを常に最新にする（アクセス計測タグを確実に届けるため）\n'
            printf '<IfModule mod_headers.c>\n'
            printf '  <FilesMatch "\\.(html|htm)$">\n'
            printf '    Header set Cache-Control "no-cache, must-revalidate, max-age=0"\n'
            printf '  </FilesMatch>\n'
            printf '</IfModule>\n'
            printf '# === COSMINI-NOCACHE ここまで ===\n'
          } >> .htaccess
          echo "--- アップロードされる .htaccess ---"
          cat .htaccess

      # 過去の実行で誤ってアップロードされた作業用ファイルをサーバーから削除します。
      - name: Remove stray work files from server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -u
          OPTS="set ftp:ssl-allow no; set ftp:passive-mode on; set ftp:prefer-epsv no; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 20;"
          lftp -c "$OPTS open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; cd '$FTP_SERVER_DIR'; rm -f listing.txt; rm -f lftp_err.txt; rm -f remote.htaccess" || true
          echo "作業用ファイルの削除を試みました。"

      - name: Upload via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set ftp:passive-mode on;
          set ftp:prefer-epsv no;
          set ssl:verify-certificate no;
          set net:max-retries 3;
          set net:timeout 20;
          set net:persist-retries 3;
          set mirror:parallel-transfer-count 1;
          open -u '${FTP_USERNAME}','${FTP_PASSWORD}' '${FTP_SERVER}';
          mirror --reverse --verbose --continue \
            --exclude-glob .git/ \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            --exclude-glob .claude/ \
            --exclude-glob config.php \
            --exclude-glob config.sample.php \
            --exclude-glob orders.log \
            --exclude-glob README.txt \
            --exclude-glob docs/ \
            --exclude-glob access.json \
            ./ '${FTP_SERVER_DIR}';
          "
