name: Deploy to server (FTP)

# main に push されるたび、XREA サーバーへ lftp で自動アップロードします。
# basic-ftp ベースのアクションは XREA のパッシブ(EPSV)応答で ECONNRESET になるため、
# PASV を強制できる lftp を使います。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # （任意）GitHub の Secrets に STATS_PASS を登録しておくと、
      # アクセス解析ページ（stats.php）のパスワードとして自動で反映されます。
      # 登録していない場合は、初回アクセス時にブラウザ画面上で設定できます。
      - name: Apply stats password from secret (optional)
        env:
          STATS_PASS: ${{ secrets.STATS_PASS }}
        run: |
          if [ -n "$STATS_PASS" ]; then
            mkdir -p data
            B64=$(printf '%s' "$STATS_PASS" | base64 | tr -d '\n')
            printf "<?php\nreturn array('pass_b64' => '%s');\n" "$B64" > data/stats-auth.php
            echo "STATS_PASS を stats.php のパスワードとして反映します。"
          else
            echo "STATS_PASS は未登録です（ブラウザ上での初回設定を使用します）。"
          fi

      - name: Upload via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set ftp:passive-mode on;
          set ftp:prefer-epsv no;
          set ssl:verify-certificate no;
          set net:max-retries 3;
          set net:timeout 20;
          set net:persist-retries 3;
          set mirror:parallel-transfer-count 1;
          open -u '${FTP_USERNAME}','${FTP_PASSWORD}' '${FTP_SERVER}';
          mirror --reverse --verbose --continue \
            --exclude-glob .git/ \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            --exclude-glob .claude/ \
            --exclude-glob config.php \
            --exclude-glob config.sample.php \
            --exclude-glob orders.log \
            --exclude-glob README.txt \
            --exclude-glob docs/ \
            --exclude-glob access.json \
            ./ '${FTP_SERVER_DIR}';
          "
