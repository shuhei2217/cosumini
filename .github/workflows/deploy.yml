name: Deploy to server (FTP)

# main に push されるたび、XREA サーバーへ lftp で自動アップロードします。
# basic-ftp ベースのアクションは XREA のパッシブ(EPSV)応答で ECONNRESET になるため、
# PASV を強制できる lftp を使います。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set ftp:passive-mode on;
          set ftp:prefer-epsv no;
          set ssl:verify-certificate no;
          set net:max-retries 3;
          set net:timeout 20;
          set net:persist-retries 3;
          set mirror:parallel-transfer-count 1;
          open -u '${FTP_USERNAME}','${FTP_PASSWORD}' '${FTP_SERVER}';
          mirror --reverse --verbose --continue \
            --exclude-glob .git/ \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            --exclude-glob .claude/ \
            --exclude-glob config.php \
            --exclude-glob config.sample.php \
            --exclude-glob orders.log \
            --exclude-glob README.txt \
            --exclude-glob docs/ \
            --exclude-glob access.json \
            ./ '${FTP_SERVER_DIR}';
          "
